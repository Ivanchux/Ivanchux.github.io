<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CODE_CRT — Editor Retro | RETROTERM.AI</title>
  <link rel="stylesheet" href="editor.css">
  <link rel="stylesheet" href="accesibilidad.css">
  <link rel="icon" href="favicon.ico" />
  <style>
    .activa{
      display: block !important;
      opacity: 1 !important;
    }

    /* Tres columnas en escritorio */
    .editor-contenedor{
      display: flex;
      flex-wrap: nowrap;
      gap: 0;
      width: 100%;
      border: 2px solid #00ff66;
      border-radius: 4px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .editor-par{
      display: flex;
      flex-direction: column;
      flex: 1 1 0;
    }

    .editor-par + .editor-par{
      border-left: 2px solid #00ff66;
    }

    /* Apilar en móvil */
    @media(max-width: 768px){
      .editor-contenedor{
        flex-wrap: wrap;
      }
      .editor-par{
        width: 100%;
        flex: none;
        border-left: none !important;
        border-top: 2px solid #00ff66;
      }
      .editor-par:first-child{
        border-top: none;
      }
    }
  
  /* ── CANVAS FONDO ─── */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.45;
  }
  /* fondo transparente sobre canvas */
  .pantalla, .pantalla-wide {
    background: transparent !important;
    border-color: #00ff6633 !important;
    box-shadow: 0 0 15px #00ff6622 !important;
  }
</style>
</head>
<body>
<a class="skip-link" href="#main-content">→ Saltar al contenido principal</a>
<canvas id="bg-canvas" aria-hidden="true" role="presentation"></canvas>

<main id="main-content">
<section class="pantalla activa pantalla-wide" aria-label="Editor de código CODE_CRT">

  <header class="cabecera">
    <h1>MODO DESARROLLO <span class="cursor-blink" aria-hidden="true">|</span></h1>
    <p class="subtitulo">CODE_CRT — Editor retro integrado</p>
  </header>

  <div class="editor-contenedor">

    <div class="editor-par">
      <label for="html-editor" class="editor-label editor-label-html">HTML</label>
      <textarea id="html-editor" class="editor-crt" spellcheck="false" aria-label="Editor HTML"><!-- HTML -->
<h1>Hola RetroTerm</h1>
<p>Escribe HTML, CSS y JS a la vez</p></textarea>
    </div>

    <div class="editor-par">
      <label for="css-editor" class="editor-label editor-label-css">CSS</label>
      <textarea id="css-editor" class="editor-crt" spellcheck="false" aria-label="Editor CSS">/* CSS */
body { background: #000; color: #00ff66; font-family: 'Courier New', monospace; }
h1 { text-shadow: 0 0 6px #00ff66; }</textarea>
    </div>

    <div class="editor-par">
      <label for="js-editor" class="editor-label editor-label-js">JS</label>
      <textarea id="js-editor" class="editor-crt" spellcheck="false" aria-label="Editor JavaScript">// JS
console.log("RetroCRT funcionando!");</textarea>
    </div>

  </div>

  <div class="editor-botones">
    <button id="ejecutar" aria-label="Ejecutar el código en la vista previa">&#9654; Ejecutar</button>
    <button id="limpiar" aria-label="Limpiar la vista previa">&#129529; Limpiar Preview</button>
    <button id="guardar" aria-label="Guardar el código en memoria local">&#128190; Guardar</button>
  </div>

  <iframe loading="lazy" id="preview" title="Vista previa del código" aria-label="Vista previa del código ejecutado"></iframe>

  <a href="index.html" class="volver">&#8592; Volver al HUB</a>

</section>
</main>

<script>
  const htmlEditor = document.getElementById('html-editor');
  const cssEditor  = document.getElementById('css-editor');
  const jsEditor   = document.getElementById('js-editor');
  const preview    = document.getElementById('preview');

  function actualizarPreview(){
    const html = htmlEditor.value;
    const css  = "<style>" + cssEditor.value + "<\/style>";
    const js   = "<script>" + jsEditor.value + "<\/script>";
    preview.srcdoc = html + css + js;
  }

  document.getElementById('ejecutar').addEventListener('click', actualizarPreview);

  document.getElementById('limpiar').addEventListener('click', () => {
    preview.srcdoc = "";
  });

  document.getElementById('guardar').addEventListener('click', () => {
    localStorage.setItem('htmlCRT', htmlEditor.value);
    localStorage.setItem('cssCRT', cssEditor.value);
    localStorage.setItem('jsCRT', jsEditor.value);
    alert('Código guardado en el navegador.');
  });

  [htmlEditor, cssEditor, jsEditor].forEach(editor => {
    editor.addEventListener('input', actualizarPreview);
  });

  window.addEventListener('load', () => {
    const h = localStorage.getItem('htmlCRT');
    const c = localStorage.getItem('cssCRT');
    const j = localStorage.getItem('jsCRT');
    if(h) htmlEditor.value = h;
    if(c) cssEditor.value  = c;
    if(j) jsEditor.value   = j;
    actualizarPreview();
  });
</script>

<script src="accesibilidad.js"></script>
<script>
(function() {
  var canvas = document.getElementById("bg-canvas");
  if (!canvas) return;
  var ctx = canvas.getContext("2d");
  var W, H;
  var STAR_COUNT=90, WAVE_COUNT=5, CONN_DIST=180, SPEED=0.18, WAVE_SPEED=0.0004;
  var COLOR_NODE_A="rgba(0, 255, 102,", COLOR_NODE_B="rgba(255, 176, 0,";
  var COLOR_LINE="rgba(0, 220, 90,", COLOR_WAVE="rgba(255, 176, 0,";
  var stars=[], waves=[];
  function resize(){ W=canvas.width=window.innerWidth; H=canvas.height=window.innerHeight; }
  function initStars(){
    stars=[];
    for(var i=0;i<STAR_COUNT;i++){
      var a=Math.random()>0.75;
      stars.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*SPEED,vy:(Math.random()-0.5)*SPEED,r:Math.random()*1.4+0.4,col:a?COLOR_NODE_B:COLOR_NODE_A,phase:Math.random()*Math.PI*2,pspeed:0.008+Math.random()*0.012});
    }
  }
  function initWaves(){
    waves=[];
    for(var i=0;i<WAVE_COUNT;i++){
      waves.push({amp:30+Math.random()*60,freq:0.003+Math.random()*0.005,phase:Math.random()*Math.PI*2,speed:(Math.random()>0.5?1:-1)*(WAVE_SPEED+Math.random()*WAVE_SPEED),yBase:(i+1)*(1/(WAVE_COUNT+1)),alpha:0.018+Math.random()*0.022});
    }
  }
  function drawWaves(){
    for(var w=0;w<waves.length;w++){
      var wv=waves[w]; wv.phase+=wv.speed*60;
      ctx.beginPath(); ctx.moveTo(0,H*wv.yBase);
      for(var x=0;x<=W;x+=4){ ctx.lineTo(x,H*wv.yBase+Math.sin(x*wv.freq+wv.phase)*wv.amp); }
      ctx.strokeStyle=COLOR_WAVE+wv.alpha+")"; ctx.lineWidth=1; ctx.stroke();
    }
  }
  function drawConnections(){
    for(var i=0;i<stars.length;i++){
      for(var j=i+1;j<stars.length;j++){
        var dx=stars[i].x-stars[j].x,dy=stars[i].y-stars[j].y,dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<CONN_DIST){ ctx.beginPath(); ctx.moveTo(stars[i].x,stars[i].y); ctx.lineTo(stars[j].x,stars[j].y); ctx.strokeStyle=COLOR_LINE+(1-dist/CONN_DIST)*0.18+")"; ctx.lineWidth=0.5; ctx.stroke(); }
      }
    }
  }
  function drawStars(){
    for(var i=0;i<stars.length;i++){
      var s=stars[i]; s.phase+=s.pspeed;
      var pulse=0.5+0.5*Math.sin(s.phase),alpha=0.25+pulse*0.55,radius=s.r*(0.8+pulse*0.4);
      var grad=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,radius*4);
      grad.addColorStop(0,s.col+(alpha*0.5)+")"); grad.addColorStop(1,s.col+"0)");
      ctx.beginPath(); ctx.arc(s.x,s.y,radius*4,0,Math.PI*2); ctx.fillStyle=grad; ctx.fill();
      ctx.beginPath(); ctx.arc(s.x,s.y,radius,0,Math.PI*2); ctx.fillStyle=s.col+alpha+")"; ctx.fill();
      s.x+=s.vx; s.y+=s.vy;
      if(s.x<-20)s.x=W+20; if(s.x>W+20)s.x=-20;
      if(s.y<-20)s.y=H+20; if(s.y>H+20)s.y=-20;
    }
  }
  function draw(){ ctx.clearRect(0,0,W,H); drawWaves(); drawConnections(); drawStars(); requestAnimationFrame(draw); }
  resize(); initStars(); initWaves(); draw();
  window.addEventListener("resize",function(){ resize(); initStars(); initWaves(); });
})();
</script>

</body>
</html>
